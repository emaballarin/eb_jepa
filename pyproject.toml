[project]
name = "eb_jepa"
version = "0.1.1"
description = "Energy-Based JEPA"
authors = [
    {name = "Basile Terver", email = "basileterv@meta.com"},
    {name = "Randall Balestriero", email = "rbalestriero@meta.com"},
    {name = "Megi Dervishi", email = "megidervishi@meta.com"},
    {name = "David Fan", email = "davidfan@meta.com"},
    {name = "Quentin Garrido", email = "garridoq@meta.com"},
    {name = "Tushar Nagarajan", email = "tusharn@meta.com"},
    {name = "Koustuv Sinha", email = "koustuvs@meta.com"},
    {name = "Wancong Zhang", email = "wz1232@nyu.edu"},
    {name = "Mike Rabbat", email = "mikerabbat@meta.com"},
    # Equal contribution as senior authors
    {name = "Yann LeCun", email = "yann@meta.com"},
    {name = "Amir Bar", email = "amirbar@meta.com"},
]
dependencies = [
    "einops>=0.8.2",
    "fire>=0.7.0",
    "huggingface-hub>=1.25.1",
    "matplotlib>=3.11.0",
    "opencv-python>=5.0.0.93",
    "pudb>=2025.1",
    "scikit-learn>=1.9.0",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "torchcodec>=0.14.0",
    "torchvision",
    "transformers",
    "wandb[media]>=0.28.0",
    "gymnasium>=1.3.0",
    "imageio",
    "lpips>=0.1.4",
    "seaborn",
    "submitit",
    "tqdm",
    "pymunk",
    "decord",
    "omegaconf",
    "ruamel.yaml",
    "h5py",
    # Scientific computing
    "scipy",
    "scikit-image",
    # Simulation environments
    "gym>=0.26.2",
    "gymnasium>=1.3.0",
    "pygame>=2.6.1",
    "pymunk>=6.8.0",
    "shapely",
    "pybullet",
    "mujoco>=3.10.0",
    "dm-control>=1.0.43",
    "metaworld",
]
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["eb_jepa*"]

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pytest>=9.1.1",
    "autoflake",
]
