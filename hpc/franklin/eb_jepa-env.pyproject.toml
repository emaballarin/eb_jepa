# uv environment spec for the EB-JEPA Moving MNIST (video_jepa) benchmark on
# the Franklin HPC cluster.
#
# Mirrors the reference environment at
#   /home/emaballarin/tries/2026-03-02-envbuild/  (minilit.toml)
# -- nightly PyTorch, uv-managed Python, in-home venv -- but:
#   * CUDA is pinned to 12.6.x (cu126), NOT cu132. Franklin's GPU-node
#     kernel-level NVIDIA drivers are incompatible with the CUDA 13+ runtime.
#     The newer cu128 nightly channel has since been deprecated and removed, so
#     cu126 is the only pre-CUDA-13 PyTorch nightly channel that remains.
#   * Dependencies are trimmed to what the Moving MNIST import path needs (the
#     heavy/fragile RL-sim deps are intentionally omitted).
#
# `eb_jepa` itself is installed editable (`-e . --no-deps`) by build_env.sh;
# it does not appear here. This file is a "virtual" project (package = false):
# uv installs the dependencies but does not try to build a package from it.

[project]
name = "eb-jepa-franklin-env"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    # PyTorch nightly (cu126) -- routed to the index via [tool.uv.sources] below
    "torch",
    "torchvision",
    # Core numerics / config / IO used on the Moving MNIST path
    "numpy",
    "einops",
    "fire",
    "omegaconf",
    "ruamel.yaml",
    "tqdm",
    "wandb[media]",
    "opencv-python",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "scikit-image",
    "scipy",
    "imageio",
    "lpips",
    "h5py",
    "huggingface-hub",
    "tiktoken",
    "transformers",
    "submitit",
]

[tool.uv]
package = false                      # virtual project: install deps, don't build it
prerelease = "allow"
index-strategy = "unsafe-best-match"
python-preference = "only-managed"
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-nightly-cu126"
url = "https://download.pytorch.org/whl/nightly/cu126"

[tool.uv.sources]
torch = [{ index = "pytorch-nightly-cu126" }]
torchvision = [{ index = "pytorch-nightly-cu126" }]
